<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login page: APM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: rgb(60, 59, 59); height: 100vh; display: flex; justify-content: center; align-items: center; }
    
    .login-container { 
      background: #d4d3d3; padding: 50px; border-radius: 90px; 
      box-shadow: 2px 6px 100px rgba(3, 120, 237, 0.5); width: 350px; text-align: center; 
    }
    .login-container h2 { margin-bottom: 20px; color: #000000; }
    
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; color: #191414; font-size: 14px; }
    .input-group input { 
      width: 100%; padding: 10px; border: solid #605b5b95; border-radius: 25px; 
      outline: none; transition: 0.3s; 
    }
    .input-group input:focus { 
      border-color: #1181e3; box-shadow: 2px 5px 10px #2368a4d8; color: black; 
      background: linear-gradient(135deg , #fefcfc , #989797); 
    }
    
    .btn { 
      width: 70%; padding: 9px; background: linear-gradient(150deg, #4facfe, #00f2fe); 
      border: none; border-radius: 50px; color: rgb(94, 91, 91); font-size: 15px; 
      cursor: pointer; transition: 0.3s; 
    } 
    .btn:hover { 
      background: linear-gradient(135deg, #20d1db, #4facfe); 
      box-shadow: 2px 5px 10px rgba(17, 66, 114, 0.703); color: #fff;
    }
    
    .extra-links { margin-top: 15px; font-size: 11px; }
    .extra-links a { color: #4facfe; text-decoration: none; cursor: pointer; }
    .extra-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Welcome To APM</h2>
    
    <!-- Form submission handled via JavaScript function -->
    <form onsubmit="handleLoginSubmit(event)">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required minlength="6">
      </div>
      
      <button type="submit" id="loginBtn" class="btn">Login</button>
    </form>
    
    <button type="button" class="btn" onclick="safeSignUp()" style="margin-top: 15px; background: #605b5b95; color: #fff;">Create Account</button>
    
    <div class="extra-links">
      <p>Forgot your password? <a onclick="handleForgotPassword()">Reset here</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://cqmriruvvtdbkxrqkvzp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxbXJpcnV2dnRkYmt4cnFrdnpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODExODQsImV4cCI6MjEwNDM1NzE4NH0.eGhrJA8pO5EVW5k4dzFUgY5P8zf4pup3S6GY7AlrlxA';
    
    let dbClient = null;
    try {
      dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
      console.error("Supabase load error:", e);
    }

    async function handleLoginSubmit(event) {
      event.preventDefault(); // Page refresh hone se rokenge
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if(!email || !password) {
        return alert("Email aur Password dono bharna zaroori hai!");
      }

      if(!dbClient) {
        return alert("Database client load nahi ho paya!");
      }

      try {
        alert("Login request bhej rahe hain...");
        
        const { data, error } = await dbClient.auth.signInWithPassword({
          email: email,
          password: password
        });
        
        if (error) {
          alert("Login Error: " + error.message);
        } else {
          alert("Login Successful! Dashboard par chal rahe hain.");
          localStorage.setItem('currentUserEmail', email);
          localStorage.setItem('currentUserName', email.split('@')[0]);
          window.location.href = 'dashboard.html'; 
        }
      } catch (err) {
        alert("Network Catch Error: " + err.message);
      }
    }

    async function safeSignUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if(!email || !password) {
        return alert("Email aur Password bharna zaroori hai!");
      }

      try {
        const { data, error } = await dbClient.auth.signUp({
          email: email,
          password: password,
          options: { data: { full_name: email.split('@')[0] } }
        });
        
        if (error) {
          alert("Supabase Error: " + error.message);
        } else {
          alert("Account ban gaya! Login kar sakte hain.");
        }
      } catch (err) {
        alert("Catch Error: " + err.message);
      }
    }

    function handleForgotPassword() {
      alert("Reset clicked");
    }
  </script>
</body>
</html>
